project:
  title: "AI-Enabled Minimal Viable Testing for Additive Manufacturing"

paths:
  raw_data: "data/raw"
  interim_data: "data/interim"
  processed_data: "data/processed"
  outputs: "outputs"

search:
  years:
    from: 2015
    to: 2026

  journals:
    - "Additive Manufacturing"
    - "Journal of Materials Processing Technology"
    - "Journal of Manufacturing Processes"
    - "Virtual and Physical Prototyping"
    - "Progress in Additive Manufacturing"
    - "Advanced Engineering Materials"

  keywords:
    - "metal additive manufacturing mechanical properties"
    - "laser powder bed fusion tensile properties porosity"
    - "additive manufacturing fatigue Ti-6Al-4V"
    - "LPBF process parameters yield strength UTS elongation"
    - "additive manufacturing fatigue database"

data_policy:
  allowed_sources:
    - "public_dataset"
    - "open_access_article"
    - "supplementary_material"
    - "literature_extracted_data"

  excluded_sources:
    - "confidential_organisational_data"
    - "human_participant_data"
    - "interviews"
    - "questionnaires"
    - "non-public_full_text"

schema:
  input_variables:
    - "alloy"
    - "alloy_family"
    - "am_process"
    - "am_environment"
    - "build_orientation"
    - "surface_condition"
    - "surface_roughness_Ra_um"
    - "surface_roughness_Rz_um"
    - "heat_treatment"
    - "material_state"
    - "laser_power_W"
    - "scan_speed_mm_s"
    - "hatch_spacing_um"
    - "layer_thickness_um"
    - "ved_J_mm3"
    - "defect_type"
    - "porosity_percent"
    - "residual_stress_indicator"
    - "residual_stress_MPa"
    - "specimen_geometry"
    - "critical_section_size_mm"
    - "stress_concentration_factor"
    - "fatigue_environment"
    - "fatigue_machine"
    - "fatigue_standard"
    - "load_control"

  output_variables:
    - "yield_strength_MPa"
    - "uts_MPa"
    - "elongation_percent"
    - "fatigue_life_cycles"
    - "stress_amplitude_MPa"
    - "r_ratio"
    - "runout"

openai:
  model: "gpt-4o-mini"
  max_chunk_chars: 6000
  temperature: 0.0

modelling:
  random_state: 42
  test_size: 0.2

multi_agent:
  existing_artifacts_only: true
  manager_mode: "openai_with_deterministic_fallback"
  modelling_profile: "standard"
  prediction_mode: "process_only"
  cv_folds: 5
  targets:
    - "uts_MPa"
    - "yield_strength_MPa"
    - "elongation_percent"
    - "youngs_modulus_GPa"
    - "log10_fatigue_life_cycles"

testing_matrix:
  static_budgets: [24, 36, 48]
  fatigue_budgets: [30, 45, 60]
  static_replicates: 3
  fatigue_stress_levels: 5
  fatigue_replicates_per_level: 3
  fatigue_protocol:
    e466_max_frequency_Hz: 200
    ultrasonic_min_frequency_Hz: 1000
    life_thresholds_cycles: [10000000, 20000000]
    reference_stress_amplitude_MPa: 110
    reference_r_ratio: -1
    reference_frequency_Hz: 50
    stress_levels_MPa: [80, 95, 110, 125, 140]
