[project]
name = "am-mvt"
version = "0.1.0"
description = "AI-assisted minimal viable testing framework for metal additive manufacturing using publicly available secondary data."
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
